[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgtp"
version = "0.1.0"
description = "Three-stage Python workflow scaffold for chatgtp"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "chatgtp contributors" }]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
